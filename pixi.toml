[workspace]
authors = ["Wytamma Wirth <wytamma.wirth@me.com>"]
channels = ["conda-forge", "bioconda"]
name = "syrup"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
install-binaryen = "bash scripts/install-binaryen-wasm.sh"
build-libomp = "bash scripts/build-libomp-wasm.sh"
build-wasm = "bash scripts/install-binaryen-wasm.sh && bash scripts/build-cmaple-threaded.sh"
docs-serve = "mkdocs serve"
docs-build = "mkdocs build --strict"
build-cmaple-cli = "bash benchmark/scripts/build_cmaple_cli.sh benchmark/build/cmaple-cli 4"
benchmark-dryrun = "snakemake -s benchmark/Snakefile --configfile benchmark/config.yaml --dry-run --printshellcmds"
benchmark = "snakemake -s benchmark/Snakefile --configfile benchmark/config.yaml --cores 1 --printshellcmds"
simulation-benchmark-dryrun = "snakemake -s benchmark/Snakefile --configfile benchmark/config.yaml --dry-run --printshellcmds simulation_wasm_scaling"
simulation-benchmark = "snakemake -s benchmark/Snakefile --configfile benchmark/config.yaml --cores 1 --printshellcmds simulation_wasm_scaling"

[dependencies]
emscripten = ">=4.0.9,<5"
cmake = ">=4.3.2,<5"
make = ">=4.4.1,<5"
python = ">=3.11,<3.14"
snakemake-minimal = ">=8,<10"
psutil = ">=5.9,<8"
dendropy = ">=4.6,<6"
nodejs = ">=22,<26"
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.5,<10"
