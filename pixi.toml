[workspace]
authors = ["Wytamma Wirth <wytamma.wirth@me.com>"]
channels = ["conda-forge", "bioconda"]
name = "syrup"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
install-binaryen = "bash scripts/install-binaryen-wasm.sh"
build-libomp = "bash scripts/build-libomp-wasm.sh"
build-wasm = "bash scripts/install-binaryen-wasm.sh && bash scripts/build-cmaple-threaded.sh"
docs-serve = "mkdocs serve"
docs-build = "mkdocs build --strict"

[dependencies]
emscripten = ">=4.0.9,<5"
cmake = ">=4.3.2,<5"
make = ">=4.4.1,<5"
python = ">=3.11,<3.14"
nodejs = ">=22,<26"
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.5,<10"
conda = ">=26.7.2,<27"
